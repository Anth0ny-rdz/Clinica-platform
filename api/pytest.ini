[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=json
    --html=reports/pytest_report.html
    --self-contained-html

markers =
    unit: Pruebas unitarias
    integration: Pruebas de integración
    slow: Pruebas que toman mucho tiempo
    api: Pruebas de endpoints API
    database: Pruebas que requieren base de datos

[coverage:run]
source = app
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = reports/coverage_html
